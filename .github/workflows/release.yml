name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache: true

      - name: Test
        run: go test ./... -count=1

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.tag }}'
          } else {
            '${{ github.ref_name }}'
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build
        shell: pwsh
        run: |
          go build -ldflags "-s -w -X main.version=${{ steps.version.outputs.tag }}" `
            -o hypervm-mcp.exe ./cmd/hypervm-mcp
          # A checksum users can verify before running a binary as a service.
          # Set-Content rather than Out-File: Out-File wraps at the console
          # width, which would split an 81-character line in two.
          $hash = (Get-FileHash hypervm-mcp.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path hypervm-mcp.exe.sha256 -Encoding ascii `
            -Value "$hash  hypervm-mcp.exe"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} `
            hypervm-mcp.exe hypervm-mcp.exe.sha256 install.ps1 `
            --title ${{ steps.version.outputs.tag }} `
            --generate-notes `
            --verify-tag
